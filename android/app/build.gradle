plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Optional production signing: create android/key.properties with
// storePassword / keyPassword / keyAlias / storeFile (never commit it).
// Without it, release builds fall back to the debug key so CI artefacts
// remain installable for demonstration. See README "Production signing".
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.footprintguard.footprint_guard"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.footprintguard.footprint_guard"
        // minSdk 24: printing/path_provider friendly, covers >95% of devices.
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        // Footprint Guard ships ARM64 (arm64-v8a) only, per product spec:
        //   flutter build apk --release --target-platform android-arm64
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig = hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
            // Flutter AOT output is already size-optimized; R8 kept off to
            // avoid stripping reflective plugin code (printing). Enable with
            // tested keep-rules for store production if desired.
            minifyEnabled = false
            shrinkResources = false
        }
    }
}

flutter {
    source = "../.."
}
