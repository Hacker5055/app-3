pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    // The Gradle Plugin Portal no longer serves the marker artifact for
    // org.jetbrains.kotlin.Android 1.8.22 (the Flutter 3.24 template
    // version), which makes settings evaluation fail with "plugin not
    // found". Map the plugin id directly to its implementation module,
    // which is published on Maven Central (verified:
    // org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.22).
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'org.jetbrains.kotlin.Android') {
                useModule("org.jetbrains.kotlin:kotlin-gradle-plugin:${requested.version}")
            }
        }
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.1.0" apply false
    id "org.jetbrains.kotlin.Android" version "1.8.22" apply false
}

include ":app"
