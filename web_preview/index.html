<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Footprint Guard — Interactive Preview</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="platforms.js"></script>
<style>
:root{
  --black:#000000; --glass:rgba(255,255,255,.075); --glass2:rgba(255,255,255,.11);
  --border:rgba(255,255,255,.17); --border2:rgba(255,255,255,.09);
  --tx:#F5F7FA; --txm:#A7B0BE; --txl:#6B7686;
  --em:#00FFA3; --emd:#00C97E; --amb:#FFC24B; --org:#FF8A3D; --crim:#FF3B30;
  --glow:rgba(0,255,163,.10);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#000}
body{background:var(--black);color:var(--tx);font-family:'Cairo','Inter',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
html[lang="en"] body{font-family:'Inter','Cairo',system-ui,sans-serif}
.glowfield{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.glow{position:absolute;border-radius:50%;filter:blur(2px);transition:background 1.2s}
.g1{width:440px;height:440px;top:-170px;inset-inline-end:-110px;background:radial-gradient(circle,var(--glow),transparent 65%)}
.g2{width:480px;height:480px;bottom:-210px;inset-inline-start:-130px;background:radial-gradient(circle,rgba(43,75,255,.06),transparent 65%)}
.g3{width:360px;height:360px;top:340px;inset-inline-start:-180px;background:radial-gradient(circle,var(--glow),transparent 65%);opacity:.5}
.previewbar{position:relative;z-index:2;text-align:center;padding:10px 14px;font-size:11px;letter-spacing:.4px;color:var(--txl);border-bottom:1px solid var(--border2);background:rgba(255,255,255,.03);backdrop-filter:blur(14px)}
.previewbar b{color:var(--emd);font-weight:600}
.app{position:relative;z-index:1;max-width:470px;margin:0 auto;padding:18px 20px 40px}
@media(min-width:900px){.app{max-width:520px}}
svg.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.ic.sm{width:15px;height:15px}svg.ic.xs{width:12px;height:12px}
.glass{background:linear-gradient(135deg,rgba(255,255,255,.085),rgba(255,255,255,.03) 45%,rgba(255,255,255,.05));border:1px solid var(--border);border-radius:22px;backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);box-shadow:0 18px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.09)}
header{display:flex;align-items:center;gap:12px}
.orb{width:46px;height:46px;border-radius:50%;background:var(--glass);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--em);box-shadow:0 0 24px rgba(0,255,163,.15)}
.orb img{width:44px;height:44px;border-radius:50%}
h1.logo{font-size:17px;font-weight:600;line-height:1.2}
.tagline{font-size:10.5px;color:var(--txl)}
.hgroup{margin-inline-start:auto;display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;background:var(--glass);border:1px solid var(--border2);font-size:10.5px;color:var(--txm);line-height:1.25;white-space:nowrap}
.chip.amber{color:var(--amb);border-color:rgba(255,194,75,.4)} .chip.em{color:var(--emd);border-color:rgba(0,201,126,.4)}
.chip.crim{color:var(--crim);border-color:rgba(255,59,48,.4)}
.langbtn{cursor:pointer;padding:7px 13px;border-radius:99px;background:var(--glass);border:1px solid var(--border);color:var(--tx);font-size:12px;font-weight:600;font-family:inherit}
.hero{margin-top:26px}
.hero h2{font-size:27px;font-weight:300;line-height:1.25}
.hero p{margin-top:8px;font-size:13.5px;color:var(--txm);line-height:1.65;font-weight:400}
.hero .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.searchbar{margin-top:20px;border-radius:30px;padding:6px 8px;display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,rgba(255,255,255,.11),rgba(255,255,255,.05))}
.searchbar .sic{color:var(--em);display:flex;margin-inline-start:6px;transition:transform .2s}
.searchbar input{flex:1;background:none;border:none;outline:none;color:var(--tx);font-size:15px;font-family:inherit;min-width:0}
.searchbar input::placeholder{color:var(--txl);font-size:13.5px}
.kindchip{display:none}
.gobtn{width:43px;height:43px;border:none;border-radius:50%;background:linear-gradient(135deg,var(--em),var(--emd));color:#000;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 18px rgba(0,255,163,.35);flex:none}
.gobtn:active{transform:scale(.94)}
.gobtn:disabled{opacity:.55}
.kanon{display:flex;gap:6px;align-items:flex-start;margin-top:10px;font-size:11px;color:var(--txl);line-height:1.5}
.sec{margin-top:28px}
.sechead{display:flex;align-items:center;gap:8px;margin-bottom:12px;color:var(--txm)}
.sechead .t{font-size:10.5px;letter-spacing:2.2px;font-weight:600;color:var(--txl);text-transform:uppercase;white-space:nowrap}
html[lang="ar"] .sechead .t{letter-spacing:.4px;font-size:12px}
.sechead .rule{flex:1;height:1px;background:var(--border2)}
.sechead .tr{font-size:11px;color:var(--txl)}
.gaugecard{padding:18px 20px 20px;border-radius:28px}
.idrow{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--txm)}
.idrow .mono{font-family:ui-monospace,Menlo,monospace;color:var(--tx);font-size:12.5px;direction:ltr}
.gaugewrap{display:flex;justify-content:center;margin-top:4px}
.stats{display:flex;align-items:stretch;margin-top:6px}
.stat{flex:1;text-align:center}
.stat .n{font-size:18px;font-weight:500}
.stat .l{font-size:10.5px;color:var(--txl)}
.stat svg{color:var(--txm);margin-bottom:3px}
.vdiv{width:1px;background:var(--border2);margin:4px 0}
.bar{margin-top:13px}
.bar .lr{display:flex;justify-content:space-between;font-size:11.5px;color:var(--txl)}
.bar .v{font-family:ui-monospace,monospace;color:var(--txm)}
.track{height:4px;border-radius:99px;background:rgba(255,255,255,.08);margin-top:5px;overflow:hidden}
.fill{height:100%;border-radius:99px;width:0;transition:width 1.1s cubic-bezier(.2,.8,.25,1)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 16px;border-radius:16px;border:1px solid var(--border);background:var(--glass);color:var(--tx);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;width:100%}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(135deg,var(--em),var(--emd));color:#000;border:none;box-shadow:0 0 18px rgba(0,255,163,.25)}
.btnrow{display:flex;gap:10px}.btnrow .btn{flex:1}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.exp{padding:12px;border-radius:18px;min-height:104px;display:flex;flex-direction:column}
.exp .dot{width:6px;height:6px;border-radius:50%;position:absolute;top:0;inset-inline-end:0}
.exp .icw{position:relative;width:fit-content}
.exp .nm{margin-top:auto;font-size:11.5px;font-weight:500;line-height:1.3}
.exp .st{font-size:9.5px;margin-top:3px}
.timeline{padding:18px 16px 8px}
.tl{display:flex;gap:10px}
.rail{width:22px;display:flex;flex-direction:column;align-items:center}
.rail .pt{width:10px;height:10px;border-radius:50%;border:1.6px solid var(--txm);background:#000;margin-top:5px;flex:none}
.rail .ln{flex:1;width:1px;background:var(--border);margin:4px 0}
.tlbody{flex:1;padding-bottom:22px;min-width:0}
.tl:last-child .tlbody{padding-bottom:10px}
.tlhead{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.tlhead .bt{font-size:15px;font-weight:500}
.tlchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.tldesc{font-size:11.5px;color:var(--txl);line-height:1.55;margin-top:8px}
.platcard{padding:4px 16px}
.prow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border2)}
.prow:last-child{border-bottom:none}
.pico{width:37px;height:37px;border-radius:11px;background:var(--glass);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;color:var(--tx)}
.pname{font-size:13.5px;font-weight:500}
.purl{font-size:10px;color:var(--txl);font-family:ui-monospace,monospace;direction:ltr;text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
html[dir="rtl"] .purl{text-align:right}
.pmeta{flex:1;min-width:0}
.rem{display:flex;gap:12px;padding:16px;margin-bottom:10px;align-items:flex-start}
.rem .stripe{width:3px;align-self:stretch;border-radius:99px;flex:none}
.rem .ric{width:39px;height:39px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;border:1px solid}
.rem .pri{font-size:9.5px;letter-spacing:1.8px;font-weight:700}
.rem h4{font-size:14px;font-weight:500;line-height:1.4;margin-top:3px}
.rem p{font-size:12px;color:var(--txm);line-height:1.6;margin-top:4px}
.rem .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rem .rb{flex:1;min-width:0}
.cardpad{padding:18px}
.field{display:flex;gap:10px}
.inp{flex:1;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.05);border:1px solid var(--border2);border-radius:15px;padding:0 13px;color:var(--txm);min-width:0}
.inp input{flex:1;background:none;border:none;outline:none;color:var(--tx);font-size:13.5px;font-family:inherit;padding:13px 0;min-width:0}
.inp input::placeholder{color:var(--txl)}
.pwres{margin-top:14px;padding:13px;border-radius:14px;border:1px solid;display:flex;gap:10px;align-items:flex-start}
.pwres .big{font-size:13px;font-weight:600}
.pwres .mono{font-size:11px;color:var(--txm);font-family:ui-monospace,monospace;direction:ltr}
.setrow{display:flex;align-items:center;gap:12px}
.setrow .sb{flex:1}
.setrow .st1{font-size:14px;font-weight:500}
.setrow .st2{font-size:11.5px;color:var(--txl);line-height:1.5}
.sw{position:relative;width:50px;height:29px;flex:none;cursor:pointer}
.sw input{display:none}
.sw .tr{position:absolute;inset:0;border-radius:99px;background:rgba(255,255,255,.15);transition:.25s}
.sw .th{position:absolute;top:3.5px;inset-inline-start:4px;width:22px;height:22px;border-radius:50%;background:#A7B0BE;transition:.25s}
.sw input:checked~.tr{background:rgba(0,255,163,.25)}
.sw input:checked~.th{transform:translateX(-20px);background:var(--em)}
html[dir="ltr"] .sw input:checked~.th{transform:translateX(20px)}
.langchips{display:flex;gap:8px}
.lchip{padding:7px 15px;border-radius:99px;border:1px solid var(--border2);background:var(--glass);font-size:12px;font-weight:600;color:var(--txm);cursor:pointer;font-family:inherit}
.lchip.on{color:var(--em);border-color:var(--em);background:rgba(0,255,163,.1)}
.lbl{font-size:10.5px;letter-spacing:1.6px;font-weight:600;color:var(--txl);text-transform:uppercase;margin:18px 0 8px}
html[lang="ar"] .lbl{letter-spacing:.3px;font-size:12px}
.note{font-size:11.5px;color:var(--txl);line-height:1.6}
.err{margin-top:14px;padding:16px;border-color:rgba(255,59,48,.5);display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--txm)}
.warn{padding:14px 16px;border-color:rgba(255,194,75,.45);display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
footer{margin-top:26px;text-align:center}
footer .note{max-width:400px;margin:0 auto}
.ver{font-size:10px;color:var(--txl);margin-top:9px;letter-spacing:.5px}
/* Scanner overlay */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;padding:22px}
.overlay.show{display:flex}
.scan{width:100%;max-width:400px;padding:26px 24px 22px;border-radius:28px;text-align:center}
.radar{position:relative;width:168px;height:168px;margin:0 auto;border-radius:50%;border:1px solid var(--border);overflow:hidden;background:rgba(0,0,0,.45)}
.radar::before,.radar::after{content:"";position:absolute;border:1px solid var(--border2);border-radius:50%}
.radar::before{inset:27px}.radar::after{inset:56px}
.sweep{position:absolute;inset:0;background:conic-gradient(from 0deg,rgba(0,255,163,.4),rgba(0,255,163,.05) 70deg,transparent 90deg);animation:spin 2.5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.radar .cross{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:var(--em);z-index:2}
.radar .ax{position:absolute;background:var(--border2)}
.blip{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--em);animation:blip 2.5s infinite}
@keyframes blip{0%{opacity:1;box-shadow:0 0 10px var(--em)}60%{opacity:.25;box-shadow:none}100%{opacity:.2}}
.scan .sl{margin-top:18px;font-size:11px;letter-spacing:3px;font-weight:600;color:var(--em)}
.scan .stg{margin-top:6px;font-size:13.5px;color:var(--txm);min-height:22px}
.pbar{height:3px;border-radius:99px;background:rgba(255,255,255,.1);margin-top:16px;overflow:hidden}
.pfill{height:100%;background:var(--em);width:0;transition:width .3s}
.pct{font-family:ui-monospace,monospace;font-size:12px;color:var(--txm);margin-top:8px}
.log{margin-top:14px;background:rgba(0,0,0,.5);border:1px solid var(--border2);border-radius:14px;padding:11px 12px;text-align:left;direction:ltr;min-height:96px}
.log div{font-family:ui-monospace,monospace;font-size:10px;color:#8FE9C4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.7}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(16px);background:#14161B;border:1px solid var(--border);color:var(--tx);padding:12px 18px;border-radius:14px;font-size:13px;z-index:99;opacity:0;pointer-events:none;transition:.3s;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hidden{display:none!important}
/* Print = PDF report (printer-friendly, high contrast) */
#printReport{display:none}
@media print{
  body>*{display:none!important}
  #printReport{display:block!important;color:#111318;font-family:'Inter',Arial,sans-serif;padding:8px}
  #printReport h1{font-size:19px;letter-spacing:1px}
  #printReport h2{font-size:13.5px;margin:20px 0 8px;border-bottom:1.4px solid #111318;padding-bottom:5px}
  #printReport table{width:100%;border-collapse:collapse;font-size:10.5px}
  #printReport th,#printReport td{border:.6px solid #D9DDE3;padding:5px 7px;text-align:left}
  #printReport th{background:#F2F4F7}
  #printReport .score{font-size:26px;font-weight:700}
  #printReport .small{font-size:9.5px;color:#5A6068}
  #printReport .rem{border-left:2.5px solid #98A2B3;padding-left:10px;margin-bottom:10px}
  #printReport .rem.crit{border-color:#D92D20}
}
</style>
</head>
<body>
<div class="glowfield"><div class="glow g1" id="glow1"></div><div class="glow g2"></div><div class="glow g3" id="glow3"></div></div>
<div class="previewbar" id="previewBar"></div>

<div class="app">
  <header>
    <div class="orb"><img src="icon-192.png" alt="Footprint Guard"></div>
    <div>
      <h1 class="logo" id="appName"></h1>
      <div class="tagline" id="tagline"></div>
    </div>
    <div class="hgroup">
      <span class="chip amber" id="modeBadge"></span>
      <button class="langbtn" id="langToggle">EN</button>
    </div>
  </header>

  <div class="hero" id="hero">
    <h2 id="heroTitle"></h2>
    <p id="heroSub"></p>
    <div class="chips" id="heroChips"></div>
  </div>

  <div class="searchbar glass">
    <span class="sic" id="searchIcon"></span>
    <input id="auditInput" type="text" autocomplete="off" autocorrect="off" spellcheck="false">
    <span class="chip em kindchip" id="kindChip"></span>
    <button class="gobtn" id="goBtn" aria-label="Run audit"></button>
  </div>
  <div class="kanon"><span id="lockIc"></span><span id="kanonNote"></span></div>
  <div class="err glass hidden" id="errBox"></div>

  <div id="results" class="hidden">
    <div class="sec">
      <div class="gaugecard glass">
        <div class="idrow"><span id="idIcon"></span><span id="identityLbl"></span><span class="mono" id="identityVal"></span><span style="margin-inline-start:auto" id="mockBadge2"></span></div>
        <div class="gaugewrap">
          <svg id="gauge" width="250" height="250" viewBox="0 0 260 260"></svg>
        </div>
        <div class="stats" id="stats"></div>
        <div id="compBars"></div>
        <div style="margin-top:18px"><button class="btn" id="newAuditBtn"></button></div>
      </div>
    </div>

    <div class="sec">
      <div class="sechead"><span id="icGrid"></span><span class="t" id="hExposure"></span><span class="rule"></span></div>
      <div class="grid" id="expGrid"></div>
    </div>

    <div class="sec">
      <div class="sechead"><span id="icClock"></span><span class="t" id="hTimeline"></span><span class="rule"></span><span class="tr" id="tlCount"></span></div>
      <div id="noKeyWarn"></div>
      <div class="timeline glass" id="timeline"></div>
    </div>

    <div class="sec" id="platSec">
      <div class="sechead"><span id="icGlobe"></span><span class="t" id="hPlatforms"></span><span class="rule"></span><span class="tr" id="platCount"></span></div>
      <p class="note" id="platNote" style="margin-bottom:10px"></p>
      <div class="platcard glass" id="platList"></div>
    </div>

    <div class="sec">
      <div class="sechead"><span id="icShield"></span><span class="t" id="hRem"></span><span class="rule"></span><span class="tr" id="remCount"></span></div>
      <div id="remList"></div>
    </div>

    <div class="sec">
      <div class="sechead"><span id="icFile"></span><span class="t" id="hExport"></span><span class="rule"></span></div>
      <div class="cardpad glass">
        <div class="btnrow">
          <button class="btn primary" id="btnPdf"></button>
          <button class="btn" id="btnMd"></button>
        </div>
        <div style="margin-top:10px"><button class="btn" id="btnCopyMd"></button></div>
        <p class="note" id="pdfNote" style="margin-top:12px"></p>
      </div>
    </div>
  </div>

  <div class="sec">
    <div class="sechead"><span id="icKey"></span><span class="t" id="hPw"></span><span class="rule"></span></div>
    <div class="cardpad glass">
      <p class="note" id="pwHint" style="color:var(--txm);font-size:12.5px"></p>
      <div class="field" style="margin-top:12px">
        <div class="inp"><span id="pwKeyIc"></span><input id="pwInput" type="password" autocomplete="off" placeholder="••••••••••"></div>
        <button class="btn primary" id="pwBtn" style="width:auto;flex:none;padding:13px 20px"></button>
      </div>
      <div id="pwResult"></div>
    </div>
  </div>

  <div class="sec">
    <div class="sechead"><span id="icSliders"></span><span class="t" id="hSettings"></span><span class="rule"></span></div>
    <div class="cardpad glass">
      <div class="setrow">
        <div class="pico" style="color:var(--amb)" id="mockIc"></div>
        <div class="sb"><div class="st1" id="mockT"></div><div class="st2" id="mockD"></div></div>
        <label class="sw"><input type="checkbox" id="mockToggle" checked><span class="tr"></span><span class="th"></span></label>
      </div>
      <div class="lbl" id="keyLbl"></div>
      <div class="inp"><span id="keyIc"></span><input id="hibpKey" type="password" placeholder="hibp-api-key" autocomplete="off"></div>
      <p class="note" id="keyHint" style="margin-top:6px"></p>
      <div class="setrow" style="margin-top:18px">
        <span id="langIc"></span><div class="sb"><div class="st1" id="langLbl" style="font-size:13.5px;font-weight:400;color:var(--txm)"></div></div>
        <div class="langchips">
          <button class="lchip" id="chipAr">العربية</button>
          <button class="lchip" id="chipEn">English</button>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <p class="note" id="privacyNote"></p>
    <div class="ver" dir="ltr">Footprint Guard v1.0.0 · Flutter · ARM64 · HIBP · 60-platform OSINT</div>
  </footer>
</div>

<div class="overlay" id="overlay">
  <div class="scan glass">
    <div class="radar">
      <div class="ax" style="left:50%;top:0;width:1px;height:100%"></div>
      <div class="ax" style="top:50%;left:0;height:1px;width:100%"></div>
      <div class="sweep"></div>

function seeded(str){let h=0;for(const c of str.toLowerCase())h=(h*31+c.codePointAt(0))&0x7fffffff;let s=h||42;return()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff;};}
function shuffle(a,rng){for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function mockBreaches(input,kind){const rng=seeded(input);const pool=shuffle([...BREACH_POOL],rng);const n=kind==='phone'?1+Math.floor(rng()*2):3+Math.floor(rng()*4);return pool.slice(0,n).sort((a,b)=>b.date<a.date?-1:1);}
function mockPlatforms(input,user){const rng=seeded(input+'#platforms');const idx=shuffle(window.FG_PLATFORMS.map((_,i)=>i),rng);const found=new Set(idx.slice(0,6+Math.floor(rng()*11)));return window.FG_PLATFORMS.map((p,i)=>({platform:p,found:found.has(i),url:p.url.replace('{u}',encodeURIComponent(user||'user'))})).sort((a,b)=>(b.found-a.found)||a.platform.name.localeCompare(b.platform.name));}
const COMMON_PW=new Set(['password','123456','12345678','qwerty','letmein','admin','111111','123456789','12345','123123','password1','iloveyou']);
async function mockPw(pw){const h=await sha1Hex(pw);const weak=pw.length<10||/^[0-9]+$/.test(pw)||COMMON_PW.has(pw.toLowerCase());if(!weak)return{found:false,count:0,prefix:h.slice(0,5)};const rng=seeded(pw);return{found:true,count:1200+Math.floor(rng()*9000000),prefix:h.slice(0,5)};}
/* Remediation rules (mirror of RemediationEngine, abbreviated text shared with Dart) */
function remediation(breaches,hits,pwRes,kind){
  const steps=[];const types=new Set();breaches.forEach(b=>b.dc.forEach(d=>types.add(d)));
  const found=hits.filter(h=>h.found);const pwB=breaches.filter(b=>b.dc.includes('Passwords'));
  const add=(priority,icon,mins,tEn,tAr,bEn,bAr)=>steps.push({priority,icon,mins,tEn,tAr,bEn,bAr});
  if(pwRes?.found)add('critical','key',15,'Replace the compromised password everywhere','استبدل كلمة المرور المُخترقة في كل مكان',
    `The checked password has appeared ${pwRes.count.toLocaleString()} times in known breach corpora and is in every credential-stuffing wordlist. Replace it everywhere with a unique 16+ character passphrase from a password manager.`,
    `ظهرت كلمة المرور ${pwRes.count.toLocaleString()} مرة في قواعد التسريبات المعروفة. استبدلها في كل مكان بعبارة مرور فريدة من 16 حرفًا عبر مدير كلمات مرور.`);
  if(pwB.length)add('critical','refresh',20,`Rotate passwords on ${pwB.length} breached site(s)`,`بدّل كلمات المرور في ${pwB.length} موقع مُخترق`,
    `Passwords were exposed in: ${pwB.slice(0,3).map(b=>b.title).join(', ')}. Change those first, then every account sharing them. Assume credential stuffing is already underway.`,
    `تم تسريب كلمات مرور من: ${pwB.slice(0,3).map(b=>b.title).join('، ')}. غيّرها أولًا ثم أي حساب يشاركها. افترض أن هجمات حشو الاعتماد بدأت بالفعل.`);
  if(types.has('Credit cards')||types.has('Bank account numbers'))add('critical','creditCard',30,'Freeze and reissue exposed payment cards','جمّد البطاقات البنكية المُعرّضة وأعد إصدارها',
    'Payment data appears in your breach history. Freeze affected cards, request new numbers, enable transaction alerts, and review 12 months of statements.',
    'تظهر بيانات دفع في سجل التسريبات. جمّد البطاقات المتأثرة واطلب أرقامًا جديدة وفعّل تنبيهات المعاملات وراجع كشوف 12 شهرًا.');
  if(types.has('Social security numbers')||types.has('Government issued IDs')||types.has('Passport numbers'))add('critical','shield',45,'Fraud alert / credit freeze for exposed ID numbers','تنبيه احتيال / تجميد ائتمان لأرقام الهوية المُسربة',
    'Government IDs enable full identity theft. Place a freeze/fraud alert and never trust callers who quote your ID — call back on official numbers.',
    'أرقام الهوية تتيح سرقة هوية كاملة. فعّل التجميد/التنبيه ولا تثق بمتصل يذكر رقم هويتك — اتصل أنت بالرقم الرسمي.');
  if(breaches.length||pwRes?.found)add('high','smartphone',25,'Enable 2FA via Authenticator App (not SMS)','فعّل المصادقة الثنائية عبر تطبيق المصادقة (وليس SMS)',
    'With breached credentials circulating, enable TOTP authenticator 2FA or passkeys starting with email, banking and cloud storage. Avoid SMS where an authenticator exists (SIM-swap risk).',
    'فعّل المصادقة الثنائية TOTP أو Passkeys بدءًا من البريد والبنوك والتخزين السحابي. تجنب SMS متى توفر بديل (خطر تبديل الشريحة).');
  if(types.has('Security questions and answers')||types.has('Password hints'))add('high','help',15,'Reset security questions with random fake answers','أعد تعيين أسئلة الأمان بإجابات وهمية عشوائية',
    'Exposed answers/hints must be replaced with long random strings stored in your password manager. Real answers are OSINT-trivial.',
    'استبدل الإجابات المُسربة بسلاسل عشوائية طويلة في مدير كلمات المرور. الإجابات الحقيقية سهلة عبر OSINT.');
  if(types.has('Phone numbers')||kind==='phone')add('high','phone',10,'Harden the exposed phone number (SIM-swap & smishing)','حصّن رقم الهاتف ضد تبديل الشريحة والتصيد',
    'Set a carrier PIN/port-out lock, remove the number from public bios, enable WhatsApp & Telegram two-step verification, never read OTPs to callers.',
    'عيّن PIN لدى شركة الاتصالات وقفل نقل الرقم، احذف الرقم من النبذات العامة، فعّل التحقق بخطوتين في واتساب وتيليجرام، ولا تقرأ OTP لأي متصل.');
  if(found.length>=5)add('medium','eyeOff',40,`Reduce identity correlation across ${found.length} public accounts`,`قلّل ربط الهوية عبر ${found.length} حسابًا عامًا`,
    `Same username on ${found.slice(0,4).map(h=>h.platform.name).join(', ')} and more lets attackers build pretexts. Delete dormant accounts, re-alias non-essential profiles, strip phone/email from bios.`,
    `نفس الاسم في ${found.slice(0,4).map(h=>h.platform.name).join('، ')} وغيرها يتيح بناء سيناريوهات احتيال. احذف المهجور وغيّر أسماء الحسابات غير الأساسية واحذف الهاتف/البريد من النبذات.`);
  else if(found.length)add('low','eye',15,'Review privacy settings on discovered accounts','راجع إعدادات الخصوصية في الحسابات المكتشفة',
    'Verify each account is yours (unknown ones may be impersonation), restrict posts/friends visibility, remove personal details from public fields.',
    'تحقق أن كل حساب يخصك، قيّد رؤية المنشورات والأصدقاء، واحذف التفاصيل الشخصية من الحقول العامة.');
  if(types.has('Physical addresses')||types.has('Dates of birth'))add('medium','mapPin',20,'Expect targeted pretexting — set a family code word','توقّع احتيالًا موجّهًا — ضع كلمة سر عائلية',
    'Address/DOB exposure powers bank, courier and "relative in trouble" scams. Agree a family code word, verify calls via official numbers, opt out of data brokers.',
    'العنوان/تاريخ الميلاد يغذّي احتيال البنوك والشحن والأقارب. اتفق على كلمة سر عائلية وتحقق عبر الأرقام الرسمية واطلب الإزالة من وسطاء البيانات.');
  add('low','checkCircle',30,'Adopt a password manager + breach monitoring routine','اعتمد مدير كلمات مرور ومراقبة دورية للتسريبات',
    'Unique password per account in an audited manager, long master passphrase with offline backup, re-audit quarterly, and subscribe to breach notifications (haveibeenpwned.com/NotifyMe).',
    'كلمة فريدة لكل حساب في مدير موثوق، عبارة رئيسية طويلة بنسخة دون اتصال، تدقيق كل 3 أشهر، واشتراك في إشعارات التسريب (haveibeenpwned.com/NotifyMe).');
  const ord={critical:0,high:1,medium:2,low:3};return steps.sort((a,b)=>ord[a.priority]-ord[b.priority]);
}

/* ---- Gauge (SVG, 270deg graduated arc) ---- */
function polar(cx,cy,r,deg){const a=(deg-90)*Math.PI/180;return[cx+r*Math.cos(a),cy+r*Math.sin(a)];}
function arcPath(cx,cy,r,start,end){const[sx,sy]=polar(cx,cy,r,end),[ex,ey]=polar(cx,cy,r,start);const large=end-start<=180?0:1;return `M ${sx} ${sy} A ${r} ${r} 0 ${large} 0 ${ex} ${ey}`;}
function drawGauge(score,tier,animate=true){
  const svg=$('gauge');const C=130,R=102,START=-135,SWEEP=270;const col=TIER_COLOR[tier];
  let ticks='';for(let i=0;i<=20;i++){const a=START+SWEEP*i/20;const maj=i%5===0;
    const[p1x,p1y]=polar(C,C,R+11,a),[p2x,p2y]=polar(C,C,R+(maj?19:15),a);
    ticks+=`<line x1="${p1x}" y1="${p1y}" x2="${p2x}" y2="${p2y}" stroke="rgba(255,255,255,${maj?.35:.2})" stroke-width="${maj?1.1:.8}"/>`;
    if(maj){const[lx,ly]=polar(C,C,R+30,a);ticks+=`<text x="${lx}" y="${ly+3}" font-size="8.5" fill="#6B7686" text-anchor="middle">${i*5}</text>`;}}
  svg.innerHTML=`<defs><linearGradient id="gg" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0%" stop-color="#00FFA3"/><stop offset="38%" stop-color="#5FE3B0"/><stop offset="58%" stop-color="#FFC24B"/><stop offset="80%" stop-color="#FF8A3D"/><stop offset="100%" stop-color="#FF3B30"/></linearGradient></defs>
    ${ticks}
    <path d="${arcPath(C,C,R,START,START+SWEEP)}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="9" stroke-linecap="round"/>
    <path id="gVal" d="" fill="none" stroke="url(#gg)" stroke-width="9" stroke-linecap="round"/>
    <circle id="gDotG" r="10" fill="${col}" opacity=".3" style="filter:blur(6px)"/><circle id="gDot" r="4.2" fill="${col}" stroke="rgba(255,255,255,.8)"/>
    <text x="130" y="128" text-anchor="middle" font-size="54" font-weight="200" fill="#F5F7FA"><tspan id="gNum">0</tspan><tspan font-size="15" fill="#6B7686"> /100</tspan></text>
    <g><rect id="gTierBg" x="95" y="142" width="70" height="20" rx="10" fill="${col}" opacity=".12"/><text id="gTier" x="130" y="156" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="2" fill="${col}">${esc(tierLabel(tier).toUpperCase())}</text></g>
    <text x="130" y="182" text-anchor="middle" font-size="11.5" fill="#6B7686">${esc(S('riskScore'))}</text>`;
  const tAssess=performance.now(),dur=animate?1400:1;
  function frame(now){const p=Math.min(1,(now-tAssess)/dur),e=1-Math.pow(1-p,3),v=score*e;
    const val=$('gVal');if(!val)return;
    if(v>0.2)val.setAttribute('d',arcPath(C,C,R,START,START+SWEEP*v/100));
    const[dx,dy]=polar(C,C,R,START+SWEEP*v/100);$('gDot').setAttribute('cx',dx);$('gDot').setAttribute('cy',dy);$('gDotG').setAttribute('cx',dx);$('gDotG').setAttribute('cy',dy);
    $('gNum').textContent=Math.round(v);
    if(p<1)requestAnimationFrame(frame);}
  requestAnimationFrame(frame);
}

    <div class="pmeta"><div class="pname">${esc(h.platform.name)}</div><div class="purl">${esc(h.url)}</div></div>
    <span class="chip" style="color:${relC[h.platform.reliability]}">${esc(catLabel(h.platform.category))} · ${h.platform.reliability}</span></div>`).join('')
    :`<div style="display:flex;gap:10px;align-items:center;padding:14px 0"><span style="color:var(--em)">${ic('checkCircle','sm')}</span><span style="color:var(--txm);font-size:13px">${S('noAccounts')}</span></div>`)
    +(r.blocked?`<p class="note" style="padding:10px 0 12px">${r.blocked} ${S('corsNote')}</p>`:'');
  /* remediation */
  $('remCount').textContent=r.plan.length;
  const pc={critical:'#FF3B30',high:'#FF8A3D',medium:'#FFC24B',low:'#00C97E'};
  const pl={critical:t('CRITICAL','حرج'),high:t('HIGH','عالٍ'),medium:t('MEDIUM','متوسط'),low:t('LOW','منخفض')};
  $('remList').innerHTML=r.plan.map(st=>`<div class="rem glass"><div class="stripe" style="background:${pc[st.priority]};box-shadow:0 0 8px ${pc[st.priority]}"></div>
    <div class="ric" style="color:${pc[st.priority]};border-color:${pc[st.priority]}66;background:${pc[st.priority]}1A">${ic(st.icon,'sm')}</div>
    <div class="rb"><div class="top"><span class="pri" style="color:${pc[st.priority]}">${pl[st.priority]}</span><span class="chip">${ic('clock','xs')}~${st.mins} ${t('min','دقيقة')}</span></div>
    <h4>${esc(AR?st.tAr:st.tEn)}</h4><p>${esc(AR?st.bAr:st.bEn)}</p></div></div>`).join('');
}
function renderPw(r){
  const col=r.found?'var(--crim)':'var(--em)';
  $('pwResult').innerHTML=`<div class="pwres" style="border-color:${col}66;background:${r.found?'rgba(255,59,48,.06)':'rgba(0,255,163,.06)'}">
    <span style="color:${col}">${ic(r.found?'alertTriangle':'checkCircle')}</span>
    <div><div class="big" style="color:${col}">${r.found?`${S('pwned')} — ${S('seenX')} ${r.count.toLocaleString()} ${S('timesX')}`:S('notPwned')}</div>
    <div class="mono">SHA-1 prefix: ${r.prefix} · suffix matched locally</div></div></div>`;
}
/* ---- Scanner plumbing ---- */
const logs=[];
function slog(m){logs.push(m);if(logs.length>80)logs.shift();$('logBox').innerHTML=logs.slice(-6).map(l=>`<div>&gt; ${esc(l)}</div>`).join('');}
function setStage(i,p){$('scanStage').textContent=STR.stages[AR?1:0][i];$('pfill').style.width=Math.round(p*100)+'%';$('pct').textContent=Math.round(p*100)+'%';}
function showScan(v){$('overlay').classList.toggle('show',v);if(v){logs.length=0;$('logBox').innerHTML='';setStage(0,0);}}
function err(msg){const e=$('errBox');if(!msg){e.classList.add('hidden');return;}e.classList.remove('hidden');e.innerHTML=`<span style="color:var(--crim)">${ic('alertTriangle','sm')}</span><span>${esc(msg)}</span>`;}

/* ---- Live platform sweep (browser; CORS-limited, honest counts) ---- */
async function liveSweep(user,onp){
  const list=window.FG_PLATFORMS;const out=[];let done=0,blocked=0;
  const queue=[...list];
  async function worker(){while(queue.length){const p=queue.shift();const url=p.url.replace('{u}',encodeURIComponent(user));let found=false;
    try{const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),6000);
      const res=await fetch(url,{signal:ctl.signal});clearTimeout(to);const body=await res.text();
      if(p.checkType==='status')found=res.status>=200&&res.status<300;
      else if(p.checkType==='message_absent')found=res.status<400&&!p.markers.some(m=>body.toLowerCase().includes(m.toLowerCase()));
      else found=res.status<400&&p.markers.some(m=>body.includes(m));
    }catch(e){blocked++;}
    out.push({platform:p,found,url});done++;onp(done,list.length,out[out.length-1]);}}
  await Promise.all(Array.from({length:8},worker));
  out.sort((a,b)=>(b.found-a.found)||a.platform.name.localeCompare(b.platform.name));
  return{hits:out,blocked};
}

/* ---- Run audit ---- */
async function runAudit(){
  if(scanning)return;const input=$('auditInput').value.trim();err(null);
  if(!input){toast(S('enterFirst'));return;}
  const kind=classify(input);if(kind==='unknown'){err(S('unknown'));return;}
  scanning=true;$('goBtn').disabled=true;showScan(true);
  try{
    const user=deriveUser(input,kind),rd=redact(input,kind);
    setStage(0,.05);const lh=await sha1Hex(input.toLowerCase());
    slog('input classified: '+kind);slog('SHA-1 local: '+lh.slice(0,5)+'*'.repeat(35)+' (suffix stays local)');slog('redacted identity: '+rd);
    await sleep(MOCK?650:150);
    let pwRes=null;const pwv=$('pwInput').value;
    if(pwv){slog('k-Anonymity password check ('+(MOCK?'mock':'LIVE range API')+')');pwRes=MOCK?await mockPw(pwv):await checkPasswordLive(pwv);PWONLY=pwRes;slog('prefix '+pwRes.prefix+' sent; result: '+(pwRes.found?'PWNED x'+pwRes.count:'clean'));}
    setStage(1,.22);let breaches=[],breachNote=false;
    if(MOCK){slog('MOCK: simulating breach corpora query');await sleep(900);breaches=mockBreaches(input,kind);slog('MOCK: '+breaches.length+' simulated breach records');}
    else if(kind==='email'){const key=$('hibpKey').value.trim();
      if(key){try{slog('HIBP v3: direct TLS request');const r=await fetch('https://haveibeenpwned.com/api/v3/breachedaccount/'+encodeURIComponent(input.toLowerCase())+'?truncateResponse=false',{headers:{'hibp-api-key':key}});
        if(r.status===404){breaches=[];}else if(r.ok){const j=await r.json();breaches=j.map(b=>({title:b.Title||b.Name,domain:b.Domain||'',date:b.BreachDate,count:b.PwnCount||0,dc:b.DataClasses||[],verified:!!b.IsVerified,sensitive:!!b.IsSensitive,desc:b.Description||''})).sort((a,b)=>b.date<a.date?-1:1);}
        else{breachNote=true;slog('HIBP returned HTTP '+r.status);}}catch(e){breachNote=true;slog('HIBP blocked in browser (CORS) — native APK performs this check');}}
      else{breachNote=true;slog('HIBP v3 skipped: no API key');}}
    else slog('breach corpus lookup requires email input');
    setStage(2,.34);let hits=[],blocked=0;
    if(user){if(MOCK){const all=mockPlatforms(input,user);for(let i=0;i<all.length;i+=4){setStage(2,.34+Math.min(i+4,all.length)/all.length*.5);all.slice(i,i+4).forEach(h=>{if(h.found)slog('FOUND '+h.platform.name+' -> '+h.url);});await sleep(85);}hits=all;}
      else{const r=await liveSweep(user,(d,tot,h)=>{setStage(2,.34+d/tot*.5);if(h.found)slog('FOUND '+h.platform.name+' -> '+h.url);});hits=r.hits;blocked=r.blocked;if(blocked)slog(blocked+' platforms CORS-blocked in browser');}}
    else slog('phone input: username recon not applicable');
    setStage(3,.9);await sleep(MOCK?450:80);
    const found=hits.filter(h=>h.found);const risk=assess(breaches,found.length,pwRes);
    slog(`score = ${risk.score} (breach ${risk.bc.toFixed(1)} + platforms ${risk.pp.toFixed(1)} + password ${risk.pwp.toFixed(1)})`);
    setStage(4,.97);await sleep(MOCK?400:60);
    RESULT={input,redacted:rd,kind,user,breaches,hits,found,blocked,risk,plan:remediation(breaches,hits,pwRes,kind),pwRes,mock:MOCK,breachNote,at:new Date()};
    setStage(4,1);await sleep(250);
  }catch(e){err(S('netErr')+': '+(e.message||e));}
  finally{scanning=false;$('goBtn').disabled=false;showScan(false);if(RESULT){renderResult(true);if(PWONLY)renderPw(PWONLY);document.querySelector('.gaugecard')?.scrollIntoView({behavior:'smooth',block:'center'});}}
}

/* ---- Standalone password check (LIVE = real HIBP range API) ---- */
async function pwCheck(){
  const pw=$('pwInput').value;if(!pw)return;$('pwBtn').disabled=true;
  try{const r=MOCK?await mockPw(pw):await checkPasswordLive(pw);PWONLY=r;renderPw(r);
    if(RESULT){RESULT.pwRes=r;RESULT.risk=assess(RESULT.breaches,RESULT.found.length,r);RESULT.plan=remediation(RESULT.breaches,RESULT.hits,r,RESULT.kind);renderResult(true);}
  }catch(e){err(S('netErr')+': '+(e.message||e));}finally{$('pwBtn').disabled=false;}
}

/* ---- Exports (Markdown mirrors ReportExportService; PDF via print) ---- */
function buildMarkdown(r){
  const tier={safe:'Safe (0-20)',low:'Low (21-45)',moderate:'Moderate (46-70)',critical:'Critical (71-100)'}[r.risk.tier];
  const d=r.at;const ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  let m=`# ${AR?'تقرير تدقيق الأثر الرقمي — Footprint Guard':'Digital Footprint Audit Report — Footprint Guard'}\n\n`;
  if(r.mock)m+=`> ${AR?'تنبيه: تم إنشاء هذا التقرير في وضع التدقيق التجريبي (بيانات محاكاة).':'Notice: generated in Mock Audit Mode (simulated data).'}\n\n`;
  m+=`| Field | Value |\n|---|---|\n| Audited identity (redacted) | \`${r.redacted}\` |\n| Input type | ${r.kind} |\n| Generated | ${ds} |\n| Exposure Risk Score | **${r.risk.score}/100 — ${tier}** |\n| Breach component | ${r.risk.bc.toFixed(1)}/75 |\n| Registered-platforms penalty | ${r.risk.pp.toFixed(1)}/25 |\n| Pwned-password penalty | ${r.risk.pwp.toFixed(1)}/10 |\n\n`;
  m+=`Formula: Score = sum(DataTypeWeight x RecencyFactor) + RegisteredPlatformsPenalty + PwnedPasswordPenalty, capped at 100.\n\n## Exposure Breakdown\n\n| Data type | Breaches | Weighted |\n|---|---:|---:|\n`;
  for(const e of r.risk.breakdown)m+=`| ${e.dc} | ${e.count} | ${e.weighted.toFixed(1)} |\n`;
  m+=`\n## Breach Timeline (${r.breaches.length})\n\n`;
  for(const b of r.breaches){m+=`### ${b.title} — ${b.date}\n- Domain: ${b.domain||'—'}\n- Accounts affected: ${b.count}\n- Data exposed: ${b.dc.join(', ')}\n- Verified: ${b.verified}${b.sensitive?' · Sensitive':''}\n\n`;}
  m+=`## Discovered Public Accounts (${r.found.length} of ${r.hits.length} checked)\n\n> Usernames are not unique identities; each hit is an indicator requiring manual verification.\n\n`;
  for(const h of r.found)m+=`- **${h.platform.name}** (${h.platform.category}, reliability: ${h.platform.reliability}) — ${h.url}\n`;
  if(r.pwRes)m+=`\n## Password Check (k-Anonymity)\n\nOnly the 5-character SHA-1 prefix (${r.pwRes.prefix}) was transmitted. Result: ${r.pwRes.found?`**PWNED — seen ${r.pwRes.count} times**`:'not found in known breach corpora.'}\n`;
  m+=`\n## Remediation Plan\n\n`;
  r.plan.forEach((st,i)=>{m+=`${i+1}. **[${st.priority.toUpperCase()}] ${AR?st.tAr:st.tEn}** (~${st.mins} min)\n   ${AR?st.bAr:st.bEn}\n`;});
  m+=`\n---\n${AR?'وُلّد محليًا بالكامل بواسطة Footprint Guard. لا خوادم وسيطة، لا تخزين، لا تتبّع.':'Generated entirely on-device by Footprint Guard. No intermediary servers, no storage, no tracking.'}\n`;
  return m;
}
function printReport(r){
  const tierTxt={safe:'SAFE (0-20)',low:'LOW (21-45)',moderate:'MODERATE (46-70)',critical:'CRITICAL (71-100)'}[r.risk.tier];
  const col={safe:'#027A48',low:'#027A48',moderate:'#B54708',critical:'#D92D20'}[r.risk.tier];
  $('printReport').innerHTML=`
  <div style="display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1.6px solid #111318;padding-bottom:10px">
    <div><h1>FOOTPRINT GUARD</h1><div class="small">Digital Footprint & Social Engineering Exposure Report</div></div>
    <div style="text-align:right"><div class="score" style="color:${col}">${r.risk.score}/100</div><div style="color:${col};font-weight:700;font-size:10px">${tierTxt}</div></div>
  </div>
  ${r.mock?'<p style="color:#B54708;font-weight:700;font-size:10px;margin-top:8px">NOTICE: Mock Audit Mode — simulated data.</p>':''}
  <h2>Audit Summary</h2>
  <table><tr><th style="width:34%">Field</th><th>Value</th></tr>
  <tr><td>Audited identity (redacted)</td><td>${esc(r.redacted)}</td></tr>
  <tr><td>Input type</td><td>${r.kind}</td></tr>
  <tr><td>Breach component</td><td>${r.risk.bc.toFixed(1)} / 75</td></tr>
  <tr><td>Registered-platforms penalty</td><td>${r.risk.pp.toFixed(1)} / 25</td></tr>
  <tr><td>Pwned-password penalty</td><td>${r.risk.pwp.toFixed(1)} / 10</td></tr>
  <tr><td>Formula</td><td>Score = sum(DataTypeWeight x RecencyFactor) + Platforms + Password (max 100)</td></tr></table>
  <h2>Exposure Breakdown</h2>
  <table><tr><th>Data type</th><th>Breaches</th><th>Weighted</th></tr>
  ${r.risk.breakdown.map(e=>`<tr><td style="${e.count?'color:#D92D20;font-weight:700':'color:#5A6068'}">${e.dc}</td><td>${e.count}</td><td>${e.weighted.toFixed(1)}</td></tr>`).join('')}</table>
  <h2>Breach Timeline (${r.breaches.length})</h2>
  ${r.breaches.map(b=>`<div style="border-left:2.5px solid ${b.sensitive?'#D92D20':'#98A2B3'};padding-left:10px;margin-bottom:10px"><b>${esc(b.title)}</b> — ${b.date}<br><span class="small">${esc(b.domain||'—')} · ${b.count} accounts · ${b.verified?'verified':'unverified'}${b.sensitive?' · SENSITIVE':''}</span><br><span style="font-size:10px">Exposed: ${b.dc.join(', ')}</span></div>`).join('')||'<p class="small">No breaches.</p>'}
  <h2>Discovered Public Accounts (${r.found.length} of ${r.hits.length})</h2>
  <p class="small"><i>Usernames are not unique identities; verify each hit manually.</i></p>
  ${r.found.map(h=>`<div style="font-size:10px;margin:3px 0"><b>${esc(h.platform.name)}</b> (${h.platform.category} · ${h.platform.reliability}) — ${esc(h.url)}</div>`).join('')}
  ${r.pwRes?`<h2>Password Check (k-Anonymity)</h2><p style="font-size:10.5px">Only the 5-character SHA-1 prefix (${r.pwRes.prefix}) was transmitted. Result: ${r.pwRes.found?`<b>PWNED — seen ${r.pwRes.count} times</b>`:'not found in known corpora'}.</p>`:''}
  <h2>Remediation Plan</h2>
  ${r.plan.map((st,i)=>`<div class="rem ${st.priority==='critical'?'crit':''}"><b style="font-size:11px">${i+1}. [${st.priority.toUpperCase()}] ${esc(st.tEn)} (~${st.mins} min)</b><div class="small" style="margin-left:14px">${esc(st.bEn)}</div></div>`).join('')}
  <p class="small" style="margin-top:16px">Generated entirely on-device by Footprint Guard. No intermediary servers, no storage, no tracking. Sources: Have I Been Pwned, public platform profile pages.</p>`;
  window.print();
}

$('mockToggle').addEventListener('change',e=>{MOCK=e.target.checked;applyLang();});

$('chipAr').addEventListener('click',()=>{AR=true;applyLang();});
$('chipEn').addEventListener('click',()=>{AR=false;applyLang();});
$('btnMd').addEventListener('click',()=>{if(!RESULT)return;const blob=new Blob([buildMarkdown(RESULT)],{type:'text/markdown'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='footprint-guard-report.md';a.click();URL.revokeObjectURL(a.href);toast(S('downloadDone'));});
$('btnCopyMd').addEventListener('click',async()=>{if(!RESULT)return;await navigator.clipboard.writeText(buildMarkdown(RESULT));toast(S('copied'));});

applyLang();
